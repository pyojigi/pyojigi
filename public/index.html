<title>표지기 · 10대·20대 초 무료 진로 검사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 줄 기둥(640px) 위를 걷는 등산로. 상단 6개 '표지기'가 챕터 진행을 보여주고, 질문 카드 한 장씩 넘긴다. */
:root{
  --bg:#EEF0EA; --surface:#FAFBF7; --ink:#1D2B24; --muted:#5D6B63; --line:#D3D9CF;
  --pine:#24543F; --wood:#6B5442; --blaze:#E3A32B; --blaze-ink:#3A2A06; --sky:#3C6E91; --soft:#E2E8DD;
  --display:"Gowun Batang", "Nanum Myeongjo", serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121A16; --surface:#1A241F; --ink:#E6ECE6; --muted:#9AA89F; --line:#2E3B34;
  --pine:#7FC2A0; --wood:#B89A80; --blaze:#F0B847; --blaze-ink:#2A1D03; --sky:#86B6D8; --soft:#22302A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A16; --surface:#1A241F; --ink:#E6ECE6; --muted:#9AA89F; --line:#2E3B34;
  --pine:#7FC2A0; --wood:#B89A80; --blaze:#F0B847; --blaze-ink:#2A1D03; --sky:#86B6D8; --soft:#22302A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:14px;height:22px;background:var(--blaze);border-radius:2px}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
button:focus-visible,textarea:focus-visible,.opt:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

.trail{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mark{display:flex;flex-direction:column;gap:6px;min-width:0}
.mark .bar{height:8px;border-radius:2px;background:var(--line);overflow:hidden}
.mark .bar span{display:block;height:100%;background:var(--pine);transition:width .3s}
.mark small{font-size:11px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark.on small{color:var(--ink);font-weight:600}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

h1{font-family:var(--display);font-size:clamp(30px,7vw,42px);line-height:1.25;margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font-family:var(--display);font-size:clamp(22px,5vw,27px);line-height:1.35;margin:0;text-wrap:balance}
h3{font-size:17px;margin:0}
p{margin:0}
.lede{color:var(--muted);font-size:16px;max-width:60ch}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--pine)}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fact{border-top:3px solid var(--blaze);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.fact b{font-size:24px;font-variant-numeric:tabular-nums;font-family:var(--display)}
.fact span{font-size:13px;color:var(--muted)}
.src{font-size:12px;color:var(--muted)}

.plan{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.plan div{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:baseline}
.plan div:last-child{border-bottom:0}
.plan em{font-style:normal;font-size:12px;font-weight:700;color:var(--blaze-ink);background:var(--blaze);border-radius:4px;padding:1px 7px;flex:none}
.plan p{font-size:14px;color:var(--muted)} .plan strong{color:var(--ink);font-weight:600}

.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:10px;padding:14px 22px;cursor:pointer;background:var(--pine);color:var(--surface)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.alt{background:var(--soft);color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.hint{font-size:14px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.tiles .opt{justify-content:center;font-size:18px;font-weight:600;padding:22px 12px}
.opts.tiles .opt .tick{display:none}
.ogroups{display:flex;flex-direction:column;gap:14px}
.hero3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;max-width:330px;margin:0 auto 4px;text-align:center}
.h3i{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;min-width:0}
.h3i svg{width:56px;height:42px;display:block}
.h3i b{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--ink);white-space:nowrap;line-height:1.2}
.h3i small{font-size:11px;color:var(--muted);white-space:nowrap}
.h3i:nth-child(n+2)::before{content:"›";position:absolute;left:-4px;top:12px;font-size:20px;line-height:1;color:var(--muted)}
.h3i:nth-child(1){animation:h3slide .55s ease .35s both}
.h3i:nth-child(2){animation:h3in .45s ease .95s both}
.h3i:nth-child(3){animation:h3in .45s ease 1.55s both}
@keyframes h3slide{from{transform:translateX(100%)}to{transform:none}}
@keyframes h3in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.h3i{animation:none!important}}
.ogt{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--pine)}
.ogroups.acc{gap:8px}
.ogh{width:100%;display:flex;align-items:center;gap:10px;font:inherit;font-size:15px;font-weight:600;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;cursor:pointer}
.ogh span{flex:1}.ogh small{color:var(--muted);font-weight:400;font-size:13px}
.ogh i{font-style:normal;color:var(--muted);transition:transform .15s}.ogh[aria-expanded="true"] i{transform:rotate(90deg)}
.ogh[aria-expanded="true"]{border-color:var(--pine)}
.ogrp .opts{margin-top:8px;padding-left:6px}
.ogsel{margin:4px 2px 0;font-size:13px;color:var(--pine)}
.ogh.par{background:var(--soft);font-size:16px}
.subs{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding-left:10px;border-left:2px solid var(--line)}
.ogrp.sub .ogh{font-size:14px;padding:11px 12px}
.opt{text-align:left;font:inherit;font-size:15px;background:var(--bg);color:var(--ink);border:1.5px solid transparent;border-radius:10px;padding:13px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:border-color .15s}
.opt:hover{border-color:var(--line)}
.opt .tick{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);margin-top:3px}
.opt.multi .tick{border-radius:4px}
.opt.sel{border-color:var(--pine);background:var(--soft)}
.opt.sel .tick{border-color:var(--pine);background:var(--pine);box-shadow:inset 0 0 0 3px var(--soft)}
textarea{font:inherit;font-size:15px;width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);color:var(--ink);resize:vertical}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}

.check{border-left:4px solid var(--blaze);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--ink)}
.chip.k{background:var(--pine);color:var(--surface)}

.path{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.path.top{border:2px solid var(--pine)}
.path .rank{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--pine)}
.why{font-size:14px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.sal{display:flex;flex-direction:column;gap:6px}
.sal .track{position:relative;height:12px;background:var(--soft);border-radius:3px}
.sal .range{position:absolute;top:0;bottom:0;background:var(--sky);border-radius:3px}
.sal .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.sal .val{font-size:14px;font-variant-numeric:tabular-nums}
.first{background:var(--blaze);color:var(--blaze-ink);border-radius:10px;padding:12px 14px;font-size:14px}
a.first{display:block;text-decoration:none}
a.first:hover{filter:brightness(.97)}
.first .go{display:block;margin-top:8px;font-weight:700;text-decoration:underline}
.road{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.road summary{cursor:pointer;font-weight:700;font-size:14px}
.road[open] summary{margin-bottom:8px}
.road li.out{opacity:.5}
.road li.part b{color:var(--blaze-ink);background:var(--blaze);border-radius:4px;padding:0 4px}
.calc{border:2px solid var(--pine)}
.rkeys{display:flex;flex-wrap:wrap;gap:6px}
.rk{font:inherit;font-size:14px;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.rk[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--surface);font-weight:700}
.big2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.big2 label,.unit{min-width:0}
.big2 label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--ink)}
.unit{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px}
.unit:focus-within{border-color:var(--pine)}
.unit input{flex:1;min-width:0;width:100%;border:0;background:transparent;font:inherit;font-size:20px;font-weight:700;color:var(--ink);padding:10px 0;outline:none}
.unit em{font-style:normal;color:var(--muted);font-size:14px;font-weight:500}
.more{border-top:1px solid var(--line);padding-top:10px}
.more summary{cursor:pointer;font-size:14px;color:var(--muted);font-weight:600}
.more[open] summary{margin-bottom:10px}
.cgridin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:10px}
.cgridin label,.checks label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.cgridin input,.cgridin select,.checks select,.checks input:not([type=checkbox]){font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink);font-size:14px}
.checks label.sub{color:var(--muted);font-size:13px}
.checks label:not(.sub){flex-wrap:nowrap;align-items:flex-start}
.checks input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;flex:none}
.checks label.sub input,.checks label.sub select{width:auto;flex:1;min-width:64px}
.verdict{margin:0;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.verdict b{font-size:20px}
.verdict span{font-size:14px}
.verdict.ok{background:var(--soft);color:var(--ink)}
.verdict.bad{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.verdict.bad b{font-size:17px}

.runbar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin-top:12px}
.runbar i{display:block;height:100%;background:var(--pine)}
.runlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.months{display:flex;flex-direction:column;gap:2px}
.mrow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px dashed var(--line)}
.mrow small{color:var(--muted)}
.mrow b{font-variant-numeric:tabular-nums;font-weight:600}
.mrow b.negt{color:var(--muted)}
@media (max-width:380px){.cgridin{grid-template-columns:1fr}}
@media (max-width:340px){.big2{grid-template-columns:1fr}}
.aix{margin:0;font-size:13px;border-radius:8px;padding:7px 10px;background:var(--soft);color:var(--ink)}
.aix b{font-weight:700}
.aix-low b{color:var(--pine)}
.aix-high{background:#F6DCD8;color:#6B1A12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .aix-high{background:#4A201B;color:#F6DCD8}}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;align-self:flex-start}
button.chip{border:0;cursor:pointer;font-family:inherit}
button.chip:hover{background:var(--line)}
.first b{display:block;font-size:12px;letter-spacing:.06em;margin-bottom:2px}
.links{display:flex;flex-wrap:wrap;gap:10px;font-size:14px}
.links a{color:var(--sky)}
.warn{background:var(--soft);border-left:4px solid var(--blaze);border-radius:6px;padding:10px 12px;font-size:14px}
.btn.alt:disabled{opacity:.35}
.pro{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.pro b{font-size:12px;letter-spacing:.06em;color:var(--pine)}
.srcl{font-size:12px;color:var(--sky);word-break:keep-all}
.ytb{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px}
.ytb span{color:#C4302B}
.ytb:hover{border-color:var(--muted)}
.sup{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.sup-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.jump button{font:inherit;font-size:14px;font-weight:600;border:1.5px solid var(--pine);color:var(--pine);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer}
.jump button:hover{background:var(--soft)}
.card.money{border:2px solid var(--blaze)}
header{position:relative}
.menu{position:relative}
.menubtn{font:inherit;font-size:14px;font-weight:600;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.menubtn:hover{border-color:var(--muted)}
.menupanel{position:absolute;right:0;top:calc(100% + 8px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;display:flex;flex-direction:column;min-width:180px}
.menupanel[hidden]{display:none}
.menupanel button{font:inherit;font-size:15px;text-align:left;background:none;border:0;color:var(--ink);padding:11px 12px;border-radius:8px;cursor:pointer}
.menupanel button:hover{background:var(--soft)}
.calhead{display:flex;align-items:center;justify-content:space-between}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cgrid.wk span{font-size:12px;color:var(--muted);text-align:center}
.cd{font:inherit;aspect-ratio:1/1;max-width:100%;min-width:0;border:1px solid transparent;border-radius:8px;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.cd.empty{background:none;cursor:default}
.cd.past{opacity:.45}
.cd.today{border-color:var(--pine);font-weight:700}
.cd.sel{background:var(--pine);color:var(--surface)}
.cd i{display:flex;gap:2px;height:6px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%}
.dot.money{background:var(--blaze)} .dot.help{background:var(--sky)} .dot.corp{background:#D23F33}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:28px 0 6px;margin:0}
.foot a{color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--surface)}
.dsearch{font:inherit;font-size:16px;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg);color:var(--ink)}
.jobs{display:flex;flex-wrap:wrap;gap:6px}
.dlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.drow{border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:12px 40px 12px 14px;position:relative}
.drow summary::-webkit-details-marker{display:none}
.drow summary::after{content:"+";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--muted)}
.drow[open] summary::after{content:"−"}
.drow[open] summary{background:var(--soft)}
.dn{font-weight:700;font-size:15px}
.ds{font-size:13px;color:var(--muted)}
.dbody{padding:10px 14px 14px;display:flex;flex-direction:column;gap:10px}
button.jchip{border:1.5px solid transparent}
button.jchip[aria-expanded="true"]{background:var(--pine);color:var(--surface)}
.jdet{border-left:4px solid var(--pine);background:var(--bg);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}

const NAT_M=60, NAT_N=6, RENT_M=20, TAKE=0.87;
function runCalc(o){
  const p=PATHS.find(x=>x.key===o.k); if(!p||!p.sal) return null;
  const num=x=>{ const v=parseFloat(String(x==null?"":x).replace(/,/g,"")); return isFinite(v)&&v>=0?Math.min(v,100000):0; };
  const save=num(o.save), live=num(o.live), cost=num(o.cost), inc=num(o.inc), ui=num(o.ui);

      if(o.rent && m<=24) plus+=RENT_M;
      if(m<=uiM) plus+=ui;
    } else plus+=pay;
    bal=Math.round(bal+plus-minus);
    if(bal<0 && out==null) out=m;
    low=Math.min(low,bal);
    rows.push({m,bal,stage:m<=prepM?"준비":m<F?"구직":"첫 월급"});

  const need=low<0?-low:0;
  const before=Math.max(1,(out||F)-0);

}

function lowConf(P){ const a=P[0].s, c=P[2].s; return a<30 || (a-c)<4; }
function employed(f){const k=sitKey(); return k==="move"||k==="slump"||(k==="switch"&&st.ans.w3===0)||(k==="mil"&&f&&f.inSvc)}
function score(){
  const {t,f}=tally(); const k=sitKey(), emp=employed(f), g=goalKey(f);
  const leaving = k==="switch" || (k==="move"&&(!f.same||f.mv==="fit")) || (k==="slump"&&f.sl==="work") || (k==="gap"&&f.gw==="fit");
  const R=PATHS.map(p=>{
    let s=0, why=[], note="", block=false;
    const wn=Math.sqrt(Object.values(p.w).reduce((a,b)=>a+b*b,0))||1;
    for(const x in p.w){const v=(t[x]||0)*p.w[x]*4.5/wn; s+=v; if((t[x]||0)>=2 && p.w[x]>=2) why.push(TRAIT[x]);}
    s=Math.round(s);
    const v=[];
    if(f.noShift&&p.shift) v.push("교대·야간 근무"); if(f.noPress&&p.press) v.push("실적 압박"); if(f.noEmo&&p.emo) v.push("감정노동");
    if(f.noDesk&&p.desk) v.push("장시간 앉아서 일함"); if(f.noUnst&&p.unst) v.push("불안정한 수입");
    const lim={1:3,3:6,12:24,24:99}[f.maxPrep]||99;
    const pp = (p.key==="ath" && f.cur==="spo") ? 3 : p.prep;
    if(pp>lim && p.key!=="adv") v.push("준비 기간이 김");
    else if(f.maxPrep && p.prep>f.maxPrep) s-=6;
    block = block || !!(p.only && !p.only.includes(k));
    if(YK(k) && ["sal","bop","own","pln","pbc","rea"].includes(p.key)) block=true;
    if(k==="ms" && ["avs","mlc","hcl"].includes(p.key)) block=true;
    if(p.key==="eng" && !(f.c_eng||k==="ms" || (ENG_MJ.includes(f.mj) && (k==="col"||st.ans.edu===1||st.ans.edu===2||st.ans.edu===3)) || g==="eng")) block=true;
    if(p.key==="mtc" && !(f.c_mtc||YK(k)||f.mj==="allied"||g==="mtc")) block=true;
    if(p.key==="doc" && !(f.c_doc||YK(k)||g==="doc")) block=true;
    if(p.key==="doc" && ((k==="ms"&&st.ans.ms3===2)||(k==="hs"&&st.ans.h3===2))) block=true;
    if(p.key==="cns" && !(f.c_cns||YK(k)||["psy","sw","edu","ece"].includes(f.mj)||g==="cns")) block=true;
    if(p.key==="diet" && !(f.c_diet||YK(k)||f.mj==="food"||g==="diet")) block=true;
    if(p.key==="arc" && !(f.c_arc||YK(k)||f.mj==="arch"||g==="arc")) block=true;
    if(p.key==="ath" && !(g==="ath" || f.hsT==="pe" || ((f.maj==="spo"||f.c_sport) && st.ans.age!=null && st.ans.age<=3))) block=true;
    if(p.key==="mlc" && !(k==="mil" || f.cur==="mil")) block=true;
    if(p.key==="bop" && !(["sal","off","log","fac"].includes(f.cur) && st.ans.exp>0) && f.want!=="sal") block=true;
    if(k==="col" && p.key==="adv" && !f.grad) block=true;
    if(p.key==="hcl" && !(f.c_hcl||f.mj==="nurse"||f.mj==="allied")) block=true;
    if(p.key==="tch" && !(f.c_tch||YK(k)||k==="col"||st.ans.edu===2||st.ans.edu===3||g==="tch")) block=true;
    if(p.key==="nur" && !(f.c_nur||YK(k)||f.mj==="nurse"||g==="nur")) block=true;
    if(p.key==="spo" && !(f.maj==="spo"||f.c_sport||f.p_spo||g==="spo"||(t.body||0)>=5)) block=true;
    if(k==="ms"){
      const HB={voc:["tec","fac","aut","eng","it","rail","avi","bld","ckg","bty"],art:["dsn","art","mkt","med"],pe:["spo","ath","uni"],spe:["doc","eng","it","trd","fin"],gen:["doc"]}[f.hsT]||[];
      if(HB.includes(p.key)){ s+=8; why.unshift("가려는 고등학교와 연결"); }
      const LB={game:["it","dsn","eng"],sport:["spo","ath","uni"],make:["dsn","art","ckg","bty","bld"],talk:["svc","edu","kid","mkt"],media:["med","mkt","art"],care:["kid","car","nur","cns","diet"]}[f.like]||[];
      const li2=LB.indexOf(p.key); if(li2>=0){ s+= li2===0?12:7; why.unshift("좋아하는 것과 연결"); }
    }
    if(k==="hs"||k==="drop"||k==="retake"){
      if(p.key==="adv") s+= f.go==="adv"?40:f.go==="hsj"?-6:f.go==="mil"?0:10;
      if(p.key==="hsj") s+= f.go==="hsj"?40:f.go==="adv"?-6:10;
      if((f.voc||f.go==="skill") && (p.key==="hsj"||p.key==="tec"||p.key==="fac"||p.key==="aut")) s+=8;
    }
    if(k==="col"){

      if(f.grad && p.key==="adv") s+=40;
    }
    if(f.urgent && p.prep>3) s-= emp?1:3*f.urgent;
    const FAM={sec:["sec","avs"],avs:["avs","sec"],pub:["pub","pbc"],pbc:["pbc","pub"]};
    if(g!==p.key && f.cur && f.cur!==p.key && (FAM[f.cur]||[]).includes(p.key) && leaving && (k==="switch"||f.mv==="fit"||f.sl==="work"||f.gw==="fit")) block=true;
    if(g!==p.key && f.cur && f.cur===p.key){ if(leaving){ if(k==="switch"||f.mv==="fit"||f.sl==="work"||f.gw==="fit") block=true; else s-=10;} else if(k==="move"&&f.same){s+=6; note="지금 경력을 그대로 살리는 길";} }
    const ml=MAJLINK[f.mj]||[], li=ml.indexOf(p.key);
    if(li>=0 && f.majfit!==-1 && st.ans.c3!==1){ s+= li<2?14:9; why.unshift("전공 연결"); }
    if(f.prof && MAJLINK.prof.includes(p.key)){ s+=10; why.unshift("전문 자격 준비"); }
    const WANT={pub:["pub","pbc"],it:["it"],tec:["tec","aut","bld","eng","rail","avi"],ppl:["car","edu","spo","kid","svc","hcl","tch","nur","mtc"],sal:["sal","bop","own","rea"],art:["mkt","bty"],uni:["uni"]};
    if(f.want && WANT[f.want].includes(p.key)){s+=40; why.unshift("내가 고른 분야");}
    if(f.cur==="sal" && p.key==="bop"){s+=8; if(!why.includes("경력 연결")) why.unshift("경력 연결");}
    if(k==="mil"){
      if(f.spec==="eod" && p.key==="avs"){s+=30; why.unshift("폭발물·공병 경력");}
      if(f.spec==="mp" && (p.key==="avs"||p.key==="sec")){s+=8; why.unshift("경계·경호 경력");}
      if(f.spec==="inf" && p.key==="uni"){s+=8; why.unshift("체력·전투 경험");}
      if(f.spec==="med" && (p.key==="uni"||p.key==="car")){s+=8; why.unshift("의무 경험");}
      if(f.spec==="mech" && (p.key==="tec"||p.key==="mlc")){s+=8; why.unshift("정비 경력");}
      if(f.spec==="adm" && (p.key==="off"||p.key==="pln")){s+=5; why.unshift("행정 경력");}
      if(p.key==="mlc") s+= f.milfit===1?10:f.milfit===-1?-20:0;
      if(p.key==="uni" && f.milfit===1) s+=5;
      if(f.rank==="off" && p.key==="pln") s+=6;
    }
    if(f.noShift && p.key==="hcl") s+=4;
    if(f.c_sport && /체육|보안/.test(p.n)) s+=5;
    const isAth = (f.maj==="spo"||f.c_sport) && (f.cur==="spo"||YK(k)||k==="col"||g==="ath");
    if(isAth){ if(p.key==="uni"){ s+=6; if(!why.includes("선수 체력")) why.unshift("선수 체력"); } if(p.key==="spo"){ s+=12; why.unshift("선수 경력"); } if(p.key==="tch" && (k==="col"||st.ans.edu>=2)) s+=4; }
    if(f.teach && (p.key==="edu"||p.key==="kid")){s+=6; why.unshift("가르치는 강점");}
    if(g && p.key===g){ s+=40; why.unshift("하고 싶다고 고른 일"); }
    const PB={sec:["sec","avs"],tec:["tec"],off:["off"],log:["log"],car:["car","hcl"],spo:["spo"],it:["it"],pub:["pub","pbc"],uni:["uni"],kid:["kid"],rail:["rail"],avi:["avi"],ckg:["ckg"],bty:["bty"],aut:["aut"],bld:["bld"],rea:["rea"]};
    if(AIX[p.key]==="high" && ["job","col","hs","ms","drop","retake"].includes(k) && (MAJLINK[f.mj]||[]).indexOf(p.key)<0) s-=3;
    if(INJ_RE.test(st.ans.free||"") && p.key!=="spo"){ const bd=p.w.body||0; if(bd>=3) s-=15; else if(bd>=2) s-=6; }
    if(f["c_"+p.key]){ s+=LIC.includes(p.key)?12:6; if(!why.includes("가진 자격 연결")) why.unshift("가진 자격 연결"); }
    if(f["p_"+p.key]){ s+=6; if(!why.includes("준비 중인 자격")) why.push("준비 중인 자격"); }
    if(!block){ const pr=st.ans.top, W=p.w||{}; let tb=0;
      if(pr===0) tb=p.sal?Math.min(1,Math.max(0,(p.sal[1]-3000)/5000)):0;
      else if(pr===1) tb=Math.min(1,(W.stable||0)/4);
      else if(pr===2) tb=Math.max(0,Math.min(1,(W.time||0)/3+(p.shift||p.unst?0:0.4)));
      else if(pr===3) tb=Math.min(1,(W.growth||0)/2);
      else if(pr===4) tb=Math.min(1,(W.meaning||0)/3);
      s+=Math.round(tb*3); }
    if(block) s=-9999; else s-=1000*v.length;
    return {...p,s,v,note,why:[...new Set(why)].slice(0,3)};
  }).sort((a,b)=>b.s-a.s);
  // 본인이 직접 고른 방향은 조건에 걸리지 않는 한 반드시 상위 3위 안에 보여준다
  const WANTK={pub:["pub","pbc"],it:["it"],tec:["tec","aut","bld","eng","rail","avi"],ppl:["car","edu","spo","kid","svc","hcl","tch","nur","mtc"],sal:["sal","bop","own","rea"],art:["mkt","bty"],uni:["uni"]};
  let intent=[];
  if((k==="hs"||k==="drop"||k==="retake") && f.go==="adv" && !f.retq) intent=["adv"]; else if((k==="hs"||k==="drop") && f.go==="hsj") intent=["hsj"];
  else if(k==="drop" && f.go==="skill") intent=["tec","aut","fac","ckg","bty","bld"];
  else if(k==="col" && f.grad) intent=["adv"]; else if(f.want) intent=WANTK[f.want]||[];
  // 꼭 3위 안에 보여줄 것: 하고 싶은 일, 직접 고른 방향, 희소한 경력(군 폭발물처리). 조건에 걸리지 않을 때만.
  const groups=[];
  if(g) groups.push({keys:[g],note:"하고 싶다고 고른 일"});
  if(intent.length) groups.push({keys:intent,note:"직접 고르신 방향"});
  if(k==="col" && st.ans.c3===0 && MAJLINK[f.mj]) groups.push({keys:MAJLINK[f.mj],note:"전공을 살리는 길"});
  if(f.prof) groups.push({keys:MAJLINK.prof,note:"전문 자격을 준비하는 길"});
  const licK=LIC.filter(x=>f["c_"+x]); if(licK.length) groups.push({keys:licK,note:"가진 면허·자격을 살리는 길"});
  if(k==="mil" && f.spec==="eod") groups.push({keys:["avs"],note:"군 경력을 그대로 살리는 길"});
  const picks=[];
  for(const gr of groups){
    const c=R.filter(p=>gr.keys.includes(p.key) && p.s>-9999 && !p.v.length);
    if(!c.length || c.some(p=>picks.includes(p))) continue;
    const pick=c.find(p=>R.indexOf(p)<3) || c[0];
    if(R.indexOf(pick)>2) pick.note=pick.note||gr.note;
    picks.push(pick);
  }
  if(!picks.length) return R;
  const top=[...picks]; for(const p of R){ if(top.length>=3) break; if(!top.includes(p)) top.push(p); }
  top.sort((a,b)=>R.indexOf(a)-R.indexOf(b));
  return [...top, ...R.filter(p=>!top.includes(p))];
}

function loadReviews(){
  const box=document.getElementById("reviews"); if(!box || typeof FB_API!=="string" || typeof fetch!=="function") return;
  fetch("/api/reviews").then(r=>r.ok?r.json():null).then(d=>{ const rs=(d&&d.reviews)||[]; if(!rs.length) return;
    const SN={job:"취업 준비",move:"이직 고민",gap:"쉬는 중",slump:"슬럼프",switch:"분야 전환",mil:"군 복무·전역",hs:"고등학생",col:"대학생",ms:"중학생",drop:"학교 밖",retake:"재수·N수"};
    box.innerHTML=`<span class="eyebrow">이용한 사람들의 한마디</span><div class="revs">${rs.slice(0,6).map(r=>`<blockquote class="rev"><p>“${String(r.text).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}”</p><footer>${SN[r.sit]||"이용자"}${r.fb?" · "+r.fb:""} · ${r.day||""}</footer></blockquote>`).join("")}</div><p class="src">실제 이용자가 공개에 동의한 한마디를 운영자가 확인해 올려요.</p>`;
    box.hidden=false; }).catch(()=>{});
}

// 분류 단추 펼침 상태: 질문마다 하나만 펼침. 처음엔 고른 보기가 있는 분류를 펼쳐 둔다
const OPENG={}, OPENP={};
function openG(q,gi,hasSel){ if(OPENG[q.id]!=null) return OPENG[q.id]===gi; return !q.multi && hasSel>0; }
function question(){
  const L=list(), q=L[st.i]; if(!q){finish();return}
  const a=st.ans[q.id];
  let body;
  if(q.text){
    body=`<textarea id="ta" placeholder="예) 경비 일은 안정적인데, 이대로 10년 갈 수 있을지 모르겠다">${a||""}</textarea>`;
  } else {
    const btn=k=>{ const o=q.o[k], sel=q.multi?(a||[]).includes(k):a===k;
      return `<button type="button" class="opt ${q.multi?"multi":""} ${sel?"sel":""}" data-k="${k}" role="${q.multi?"checkbox":"radio"}" aria-checked="${sel}"><span class="tick"></span><span>${o[0]}</span></button>`; };
    const vis=q.vis?q.vis():null;
    body = q.big ? `<div class="opts tiles" role="radiogroup">${q.o.map((o,k)=>btn(k)).join("")}</div>`
      : vis ? `<div class="opts" role="radiogroup">${vis.map(btn).join("")}</div>`
      : q.groups && q.groups.some(g=>g[2])
      ? (()=>{ const isSel=k=>q.multi?(a||[]).includes(k):a===k, pars=[...new Set(q.groups.filter(g=>g[2]).map(g=>g[2]))];
          const sub=(title,ix,gi)=>{ const selIx=ix.filter(isSel), open=openG(q,gi,selIx.length);
            return `<div class="ogrp sub"><button type="button" class="ogh" data-g="${gi}" aria-expanded="${open}"><span>${title}</span><small>${selIx.length?`${selIx.length}개 고름`:`${ix.length}`}</small><i aria-hidden="true">›</i></button>${selIx.length&&!open?`<p class="ogsel">${selIx.map(k=>q.o[k][0]).join(", ")}</p>`:""}<div class="opts" role="group" ${open?"":"hidden"}>${ix.map(btn).join("")}</div></div>`; };
          return `<div class="ogroups acc">${pars.map((par,pi)=>{ const subs=q.groups.map((g,gi)=>[g,gi]).filter(([g])=>g[2]===par), allIx=subs.flatMap(([g])=>g[1]), n=allIx.filter(isSel).length, op=OPENP[q.id]===pi;
              return `<div class="ogrp"><button type="button" class="ogh par" data-p="${pi}" aria-expanded="${op}"><span>${par}</span><small>${n?`${n}개 고름`:subs.length===1?`${allIx.length}개`:`${subs.length}개 분야`}</small><i aria-hidden="true">›</i></button>${n&&!op?`<p class="ogsel">${allIx.filter(isSel).map(k=>q.o[k][0]).join(", ")}</p>`:""}${op?(subs.length===1?`<div class="opts" role="group">${subs[0][0][1].map(btn).join("")}</div>`:`<div class="subs">${subs.map(([g,gi])=>sub(g[0],g[1],gi)).join("")}</div>`):""}</div>`; }).join("")}
            ${q.groups.filter(g=>!g[2]&&!g[0]).map(g=>`<div class="ogrp"><div class="opts" role="group">${g[1].map(btn).join("")}</div></div>`).join("")}</div>`; })()
      : q.groups
      ? `<div class="ogroups acc">${q.groups.map(([title,ix],gi)=>{
          if(!title) return `<div class="ogrp"><div class="opts" role="group">${ix.map(btn).join("")}</div></div>`;
          const selIx=ix.filter(k=>q.multi?(a||[]).includes(k):a===k), open=openG(q,gi,selIx.length);
          return `<div class="ogrp"><button type="button" class="ogh" data-g="${gi}" aria-expanded="${open}"><span>${title}</span><small>${selIx.length?`${selIx.length}개 고름`:`${ix.length}개`}</small><i aria-hidden="true">›</i></button>${selIx.length&&!open?`<p class="ogsel">${selIx.map(k=>q.o[k][0]).join(", ")}</p>`:""}<div class="opts" role="group" ${open?"":"hidden"}>${ix.map(btn).join("")}</div></div>`;}).join("")}</div>`
      : `<div class="opts" role="${q.multi?"group":"radiogroup"}">${q.o.map((o,k)=>btn(k)).join("")}</div>`;
  }
  const miss=missing();
  el(`<section class="card">
    ${st.review&&miss.length?`<div class="warn">답하지 않은 질문이 <b>${miss.length}개</b> 있어요. 답을 고르면 다음 빈 질문으로, 다 채우면 결과로 넘어갑니다.</div>`:""}
    <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">${CH[q.ch]}</span><h2>${q.q}</h2>${q.hint?`<p class="hint">${q.hint}</p>`:""}${q.multi?`<p class="hint">여러 개 고를 수 있어요</p>`:""}</div>
    ${body}
    <div class="nav"><button class="btn alt" id="back" type="button" ${st.i===0?"disabled":""}>이전</button>
    <button class="btn" id="next" type="button">${st.review?(missing().filter(m=>m!==q).length?"다음 빈 질문":"결과 보기"):(q.text?"결과 보기":"다음")}</button></div>
  </section>`);
  app.querySelectorAll(".ogh.par").forEach(h=>h.onclick=()=>{ const pi=+h.dataset.p; OPENP[q.id]=OPENP[q.id]===pi?-1:pi; OPENG[q.id]=-1; const y=window.scrollY; question(); window.scrollTo({top:y}); const nh=app.querySelector(`.ogh.par[data-p="${pi}"]`); if(nh) nh.focus({preventScroll:true}); });
  app.querySelectorAll(".ogh:not(.par)").forEach(h=>h.onclick=()=>{ const gi=+h.dataset.g; OPENG[q.id]=OPENG[q.id]===gi?-1:gi; const y=window.scrollY; question(); window.scrollTo({top:y}); const nh=app.querySelector(`.ogh[data-g="${gi}"]`); if(nh) nh.focus({preventScroll:true}); });
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;
    if(q.multi){let arr=st.ans[q.id]||[]; arr=arr.includes(k)?arr.filter(x=>x!==k):[...arr,k];
      if(q.none!=null){ if(k===q.none && arr.includes(k)) arr=[k]; else arr=arr.filter(x=>x!==q.none); }
      st.ans[q.id]=arr; save(); const y=window.scrollY; question(); window.scrollTo({top:y}); const nb=app.querySelector(`.opt[data-k="${k}"]`); if(nb) nb.focus({preventScroll:true}); drawTrail();}
    else{st.ans[q.id]=k;
      if(q.id==="ag"){ st.ans.age=AGEMAP[k]; const sv=SITVIS[k]; if(st.ans.sit!=null && !sv.includes(st.ans.sit)) delete st.ans.sit; }
      save(); setTimeout(advance,160); b.classList.add("sel");}
  });
  const n=document.getElementById("next"); if(n) n.onclick=()=>{
    if(q.text) st.ans[q.id]=document.getElementById("ta").value.trim(); save();
    if(st.review){ const rest=missing().filter(m=>m!==q); if(!rest.length){ st.review=0; finish(); return; }
      const L=list(); const after=rest.find(m=>L.indexOf(m)>st.i)||rest[0]; st.i=L.indexOf(after); save(); render(); return; }
    advance(); };
  document.getElementById("back").onclick=()=>{ if(st.i>0){st.i--; st.phase="q"; save(); render();} };
}

function missing(){
  return list().filter(q=>!q.text && (st.ans[q.id]==null || (q.multi && !st.ans[q.id].length)));
}
function goMissing(){
  const m=missing();
  if(!m.length){ st.review=0; finish(); return; }
  st.review=1; st.i=list().indexOf(m[0]); st.phase="q"; save(); render();
}
function advance(){
  if(st.review){ goMissing(); return; }
  const L=list(), q=L[st.i], nx=L[st.i+1];
  if(!nx){ goMissing(); return; }
  st.i++;
  if(nx.ch!==q.ch){ st.phase="mid"; st.mid=q.ch; }
  save(); render();
}

function mid(){
  const L=list(); const lastIx=st.i-1; const {t}=tally(lastIx);
  const tops=topTraits(t,3);
  const lines={0:"출발점을 확인했어요.",1:"얼마나 버틸 수 있는지가 보입니다. 이게 경로의 현실성을 정해요.",2:"강점이 모이기 시작했어요.",3:"못 견디는 것들로 길이 꽤 좁혀졌어요.",4:"가고 싶은 방향까지 나왔어요. 마지막은 지금 상황에 맞춘 질문입니다."};
  const peek = st.mid>=2 ? score().slice(0,2).map(p=>p.n) : null;
  el(`<section class="card">
    <span class="eyebrow">${st.mid+1}장 완료</span>
    <h2>${lines[st.mid]}</h2>
    <div class="check"><p class="hint">지금까지 보이는 당신</p><div class="chips">${tops.length?tops.map(x=>`<span class="chip k">${TRAIT[x]}</span>`).join(""):`<span class="chip">아직 판단하기 일러요</span>`}</div></div>
    ${peek?`<div class="check"><p class="hint">현재 가장 가까운 길</p><div class="chips">${peek.map(n=>`<span class="chip">${n}</span>`).join("")}</div></div>`:""}
    <div class="nav"><span class="hint">다음: ${CH[st.mid+1]}</span><button class="btn" id="go" type="button">계속하기</button></div>
  </section>`);
  document.getElementById("go").onclick=()=>{st.phase="q"; save(); render()};
}

function finish(){ const first=!st.done; st.phase="result"; st.done=1; save(); render(); if(first){ try{ const P=score(); track({type:"finish",sit:sitKey(),age:st.ans.age,ag:st.ans.ag,top:P[0].key,tops:P.slice(0,3).map(p=>p.key),low:lowConf(P)}); }catch(e){} } }

function msReality(f,P){
  const out=["중학생 때 정할 건 평생 직업이 아니라 고등학교 방향이에요. 아래 직업 3개는 정답이 아니라 '먼저 알아볼 후보'예요. 연봉은 그 일을 하는 어른 기준이에요."];
  const T=f.hsT, RG=f.reg!=null?REGIONS[f.reg]:null;
  if(RG) out.push(`${RG[0]} 2027학년도 일반고 원서 접수는 ${RG[1]}이에요.${RG[2]?` 특성화고는 ${RG[2]}이에요.`:" 특성화고 날짜는 교육청 공고에서 확인하세요."} 마이스터고는 10/19~10/22${new Date()>=new Date("2026-10-23T00:00:00+09:00")?"에 이미 받았어요":"에 받아요 (마감 임박)"}. <a href="${RG[3]}" target="_blank" rel="noopener">${RG[0]} 교육청 고입 안내 ↗</a>`);
  if(T==="voc") out.push("특성화고·마이스터고는 원서를 일반고보다 먼저 받아요. 마이스터고는 학교마다 면접 같은 전형이 따로 있고, 올해 원서를 놓쳤다면 특성화고나 내년 일정을 보세요.");
  else if(T==="gen") out.push("일반고에 가면 고교학점제로 2학년부터 듣고 싶은 과목을 골라요. 관심 직업에 어떤 과목이 필요한지 미리 알아 두면 고를 때 덜 헤매요.");
  else if(T==="art"||T==="pe") out.push((T==="art"?"예술고":"체육고")+"는 실기 시험이 있어서 미리 준비해야 해요. 원서도 일반고보다 먼저 받으니, 2학년 때 가고 싶은 학교의 입학 설명회와 전형 요강을 확인해 두세요.");
  else if(T==="spe") out.push("과학고·외고 같은 학교는 자기주도학습전형처럼 전형이 따로 있어요. 성적과 함께 '왜 이 학교에 가고 싶은지'를 말할 수 있어야 해요.");
  else out.push("고등학교를 아직 못 정했다면 3학년 2학기 원서 전까지 학교 설명회나 체험에 한 번은 가 보세요. 특성화고·마이스터고는 원서를 더 일찍 받아요.");
  const gk=goalKey(f);
  if(gk && P && !P.slice(0,3).some(p=>p.key===gk)){ const gp=P.find(p=>p.key===gk);
    out.push(`하고 싶다고 고른 '${gp?gp.n:""}' 쪽은 ${gp&&gp.v&&gp.v.length?`'${gp.v.join("', '")}' 조건과 겹쳐서`:"지금 답으로는 바로 추천하기 어려워서"} 추천 3개에서는 뺐어요. 중학생이라면 고등학교 때 얼마든지 바뀔 수 있으니 준비 안내는 위에 그대로 넣었어요.`); }
  if(P && P.slice(0,3).some(p=>p.key==="ath")) out.push("선수의 문은 좁아요. 선수 준비와 함께 공부도 놓지 않아야 나중에 지도자·체육교사·경찰처럼 다른 길로도 갈 수 있어요.");
  return out;
}
function reality(f,t,P){

  if(age>=5 && (k==="switch"||k==="move")) out.push("30대 후반 이후의 전환은 신입 공채로 처음부터 다시 시작하기보다, 지금까지의 경력을 새 분야와 이어 붙이는 쪽이 빠르고 연봉 손해도 적습니다. 예를 들어 생산직 경력에 데이터를 더하면 제조 데이터·설비 자동화 쪽 문이 열려요.");
  if(P && P.slice(0,2).some(p=>p.key==="it") && edu===0) out.push("고졸로 IT·AI 직무에 가는 길은 있습니다. 다만 학력 대신 보여줄 결과물이 필요해요. 국비 부트캠프나 기업 교육 프로그램을 마치고 포트폴리오 2~3개를 만드는 걸 목표로 잡으세요.");
  if(f.fam) out.push("기대는 가족이 있으니 수입 공백이 생기지 않는 순서로 움직이는 게 중요합니다.");
  if(f.rhythm) out.push("밤낮이 바뀌었다면 첫 2주는 기상 시간 고정부터. 면접·교육 일정이 대부분 오전입니다.");
  if(f.carebreak) out.push("공백 기간은 숨기기보다 육아·돌봄이었다고 짧게 말하는 편이 면접에서 낫습니다. 그 사이 익힌 일정 관리, 문제 해결 경험을 한 줄로 붙이세요.");

    if(f.milfit===-1) out.push("군 조직이 안 맞았다면 계급·규율이 강한 직장(제복직, 군무원)은 신중하게 고르세요.");

// 익명 통계 (답 내용·적은 문장은 보내지 않음)
function track(ev){ if(ev.type!=="visit" && !agreed()) return; try{ fetch("/api/event",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(ev),keepalive:true}).catch(()=>{}); }catch(e){} }
const MISSWHY=["연봉이 실제와 달라요","나랑 안 맞아요","이미 해 봤어요","준비 기간이 비현실적이에요"];
// 자체 서버의 AI 상담 (/api/ai). 브라우저에는 API 키가 없다.
async function SAMPLE(input, opts){
  opts=opts||{};
  const messages = typeof input==="string" ? [{role:"user",content:input}] : input;
  let res;
  try{ res = await fetch("/api/ai",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages}),signal:opts.signal}); }
  catch(e){ throw {code: e&&e.name==="AbortError" ? "cancelled" : "network"}; }
  let data={}; try{ data=await res.json(); }catch(e){}
  if(!res.ok || data.error) throw {code: data.error||"upstream"};
  if(opts.onText) opts.onText({text:data.text, delta:data.text});
  if(typeof data.left==="number"){ const n=document.getElementById("aiNote"); if(n) n.textContent = messages.length===1 ? `오늘 ${data.left}번 더 읽을 수 있어요.` : `오늘 질문 ${data.left}번 더 할 수 있어요.`; }
  return {text:data.text, truncated:!!data.truncated};
}

function answerText(){
  return list().filter(q=>st.ans[q.id]!=null && st.ans[q.id]!=="").map(q=>{
    const a=st.ans[q.id];
    const v = q.text ? a : (Array.isArray(a)?a.map(k=>(q.o[k]||[""])[0]).filter(Boolean).join(", "):(q.o[a]||["-"])[0]);
    return "- "+q.q+" → "+v;
  }).join("\n");
}
const AI_ERR={limit:"오늘 사용할 수 있는 횟수를 다 썼어요. 내일 다시 이용해 주세요.",busy:"지금 이용하는 사람이 많아요. 잠시 뒤 다시 눌러 주세요.",network:"인터넷 연결을 확인하고 다시 눌러 주세요.",off:"AI 기능을 잠시 쉬고 있어요.",empty:"답이 비어 있어요. 다시 눌러 주세요.",not_granted:"사용을 허락하지 않아 이 기능을 쓸 수 없어요.",sampling_disabled:"이 계정에서는 AI 기능을 쓸 수 없어요.",rate_limited:"요청이 많아요. 잠시 뒤 다시 눌러 주세요.",session_expired:"다시 로그인한 뒤 눌러 주세요.",refused:"이 내용으로는 답을 만들지 못했어요. 적은 문장을 조금 바꿔 보세요.",empty_completion:"답이 비어 있어요. 다시 눌러 주세요."};
function aiErr(e){ return AI_ERR[e&&e.code] || "연결이 끊겼어요. 다시 눌러 주세요."; }

function setupAI(P, real, tops){
  const card=document.getElementById("aiCard"); if(!card) return;
  card.hidden=false;
  const go=document.getElementById("aiGo"), stop=document.getElementById("aiStop"), out=document.getElementById("aiOut"), note=document.getElementById("aiNote");
  const names=PATHS.map(p=>p.n).join(", ");
  const ctx = `너는 한국의 20~40대가 진로·이직·슬럼프·전역 후 방황을 끝내도록 돕는 현실적인 진로 상담사다. 따뜻하지만 듣기 좋은 말보다 실제로 도움이 되는 말을 한다.

[사용자 답변]
${answerText()}

[점수표 추천 상위 5개]
${P.slice(0,5).map((p,i)=>`${i+1}. ${p.n} (점수 ${p.s}) / 준비 ${prepTxt(p.prep)} / ${p.sal?`연봉 참고 ${p.sal[0]}~${p.sal[1]}만원`:"진학 경로"}`).join("\n")}

[점수표가 본 성향] ${tops.map(x=>TRAIT[x]).join(", ")}
[현실 점검 문구] ${real.join(" / ")}
[선택 가능한 경로 이름] ${names}`;
  let ctl, turns=[];
  stop.onclick=()=>ctl?.abort();
  go.onclick=async()=>{
    if(!SAMPLE) return;
    ctl=new AbortController(); go.disabled=true; stop.hidden=false; note.textContent=""; out.textContent="읽는 중이에요... 20초 정도 걸려요.";
    const prompt = ctx + `

아래 형식으로 한국어 존댓말, 마크다운 기호(#, *, -, 표) 없이 평문으로 답해라. 전체 700자 안팎.

■ 제가 들은 이야기
사용자의 상황을 2~3문장으로 요약한다. 자유 입력 문장이 있으면 그 말을 꼭 반영한다. 사용자가 말하지 않은 사실은 지어내지 않는다.

■ 추천에 대한 제 판단
점수표 1~3위가 이 사람에게 맞는지 판단한다. 순서를 바꾸거나 상위 5개 밖의 경로가 더 맞다면 위 '선택 가능한 경로 이름' 중에서 고르고, 근거가 된 사용자 답을 짚는다. 점수표와 같다면 왜 맞는지 한 줄로.

■ 이번 주에 할 일 3가지
교대 근무, 생활비, 준비 기간 같은 사용자의 제약 안에서 실제로 할 수 있는 구체적인 행동 3개를 번호로.

■ 한 마디
방황을 끝내는 데 필요한 말 한 문장.

연봉·시험 일정 같은 수치는 단정하지 말고 고용24·큐넷 등에서 확인하라고 안내한다. 답변에서 극단적 선택이나 자해를 암시하는 내용이 보이면 다른 내용보다 먼저 자살예방상담전화 109에 연락하도록 부드럽게 권한다.`;
    try{
      const {text,truncated}=await SAMPLE(prompt,{signal:ctl.signal,onText:({text})=>{out.textContent=text;}});
      out.textContent=text; turns=[{role:"user",content:ctx+"\n\n위 정보를 바탕으로 사용자와 상담 중이다. 짧고 구체적으로, 마크다운 없이 평문으로 답한다."},{role:"assistant",content:text}];
      if(truncated) note.textContent="답이 길어 중간에 끊겼어요.";
      document.getElementById("aiChat").hidden=false; go.textContent="다시 읽어 주기";
    }catch(e){
      out.textContent=e&&e.text?e.text:"";
      if(e&&e.code!=="cancelled") note.textContent=aiErr(e);
      if(e&&e.code==="off") card.hidden=true;
    }finally{ go.disabled=false; stop.hidden=true; }
  };
  document.getElementById("aiForm").onsubmit=async(ev)=>{
    ev.preventDefault();
    const inp=document.getElementById("aiIn"), q=inp.value.trim(); if(!q||!SAMPLE) return;
    inp.value=""; const log=document.getElementById("aiLog");
    const qd=document.createElement("p"); qd.className="q"; qd.textContent=q; log.append(qd);
    const ad=document.createElement("div"); ad.className="out"; ad.textContent="생각하는 중..."; log.append(ad);
    turns.push({role:"user",content:q}); if(turns.length>12) turns.splice(2,2);
    ctl=new AbortController(); stop.hidden=false;
    try{ const {text}=await SAMPLE(turns,{cache:false,signal:ctl.signal,onText:({text})=>{ad.textContent=text;}}); ad.textContent=text; turns.push({role:"assistant",content:text}); }
    catch(e){ ad.textContent=e&&e.text?e.text:""; turns.pop(); if(e&&e.code!=="cancelled") note.textContent=aiErr(e); }
    finally{ stop.hidden=true; }
  };
}

function windowState(wins,today){
  const d=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const fmt=x=>{const t=new Date(x);return (t.getMonth()+1)+"/"+t.getDate();};
  for(const w of wins){ const o=new Date(w[0]), c=new Date(w[1]);
    if(d<o) return {show:true,label:`신청 예정 ${fmt(w[0])}~${fmt(w[1])}`};
    if(d<=c) return {show:true,label:`지금 신청 가능 · ${fmt(w[1])} 마감`}; }
  return {show:false};
}

const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const md=x=>{const t=new Date(x+"T00:00:00");return (t.getMonth()+1)+"/"+t.getDate();};
function evState(ev,today){ const d=ymd(today); if(d<ev.s) return "예정"; if(d<=ev.e) return d===ev.e?"오늘 마감":"진행 중"; return "끝남"; }
function gcal(ev){ const nx=new Date(ev.e+"T00:00:00"); nx.setDate(nx.getDate()+1);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(ev.n)+"&dates="+ev.s.replace(/-/g,"")+"/"+ymd(nx).replace(/-/g,"")+"&details="+encodeURIComponent((ev.who?ev.who+"\n":"")+ev.url); }
// ICS-START 내 기본 캘린더로 보내는 표준 일정 파일(.ics) 만들기
function evUid(ev){ let h=5381; const t=ev.n+"|"+ev.s; for(let i=0;i<t.length;i++) h=(((h<<5)+h)^t.charCodeAt(i))>>>0; return h.toString(36); }
function icsEsc(t){ return String(t||"").replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n").replace(/([,;])/g,"\\$1"); }
function icsFold(line){ let out="", cur="", n=0; for(const ch of line){ const c=ch.codePointAt(0), b=c<0x80?1:c<0x800?2:c<0x10000?3:4; if(n+b>73){ out+=cur+"\r\n "; cur=""; n=1; } cur+=ch; n+=b; } return out+cur; }
function icsOf(evs,name){
  const d=x=>x.replace(/-/g,""), nx=e=>{ const t=new Date(e+"T00:00:00"); t.setDate(t.getDate()+1); return ymd(t).replace(/-/g,""); };
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//pyojigi//ko","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  if(name) L.push("X-WR-CALNAME:"+icsEsc(name),"X-WR-TIMEZONE:Asia/Seoul","REFRESH-INTERVAL;VALUE=DURATION:PT12H","X-PUBLISHED-TTL:PT12H");
  for(const ev of evs){
    L.push("BEGIN:VEVENT","UID:"+evUid(ev)+"@pyojigi","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+d(ev.s),"DTEND;VALUE=DATE:"+nx(ev.e),
      "SUMMARY:"+icsEsc(ev.n),"DESCRIPTION:"+icsEsc((ev.who?ev.who+"\n":"")+(ev.act?ev.act+"\n":"")+"공식 페이지: "+ev.url+"\n(표지기 캘린더)"),"URL:"+ev.url,"TRANSP:TRANSPARENT",
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc("내일부터: "+ev.n),"TRIGGER:-PT15H","END:VALARM","END:VEVENT");
  }
  L.push("END:VCALENDAR"); return L.map(icsFold).join("\r\n")+"\r\n";
}

// 문의하기: 웹에서는 서버에 저장되고 확인 번호로 답변을 봐요. 미리보기에서는 메일 쓰기로.
function myAsks(){ try{ return JSON.parse(localStorage.getItem("pyojigi_asks")||"[]"); }catch(e){ return st.asks||[]; } }
function saveAsk(x){ const a=myAsks(); a.unshift(x); st.asks=a.slice(0,20); try{ localStorage.setItem("pyojigi_asks",JSON.stringify(st.asks)); }catch(e){} save(); }
let askKind="문의";
function ask(){
  const web=typeof FB_API==="string", mine=myAsks();
  el(`<section style="display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">문의 · 오류 신고 · 제안</span><h1>궁금한 점이나 고칠 점을 알려 주세요</h1><p class="lede">보내 주신 내용은 운영자가 직접 읽고, 정해진 업데이트 때 반영해요.</p></div>
    <section class="card" id="askCard">
      <div class="seg" role="group" aria-label="종류">${["문의","오류 신고","제안"].map(k=>`<button type="button" data-ak="${k}" aria-pressed="${askKind===k}">${k}</button>`).join("")}</div>
      <textarea id="askText" maxlength="500" placeholder="예) 결과에 ○○ 직업이 없어요 / 소방청 링크가 안 열려요" style="min-height:120px"></textarea>
      <p class="hint" id="askCnt">0 / 500</p>
      <label class="agree"><input type="checkbox" id="askAgree"><span><b>(필수)</b> 이름·전화번호 같은 개인정보는 적지 않았어요. 답변을 위해 이 내용이 저장되는 데 동의해요 (답변 뒤 1년 보관 후 삭제).</span></label>
      <div class="row" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${web?`<button class="btn" id="askSend" type="button">보내기</button>`:`<a class="btn" id="askMail" href="#" target="_blank" rel="noopener" style="text-decoration:none">이메일로 보내기</a>`}<span class="hint" id="askNote" role="status"></span></div>
    </section>
    <div id="askThanks"></div>
    ${web&&mine.length?`<section class="card"><h3>내 문의</h3><div id="myAsks"><p class="hint">불러오는 중...</p></div></section>`:""}
  </section>`);
  const ta=document.getElementById("askText"), ag=document.getElementById("askAgree"), note=document.getElementById("askNote");
  const mail=document.getElementById("askMail");
  const setMail=()=>{ if(mail) mail.href="mailto:"+MAIL+"?subject="+encodeURIComponent("[표지기 "+askKind+"]")+"&body="+encodeURIComponent(((ta&&ta.value)||"")+"\n\n(표지기 문의하기 화면에서 보냈어요)"); };
  setMail();
  if(ta) ta.oninput=()=>{ const c=document.getElementById("askCnt"); if(c) c.textContent=ta.value.length+" / 500"; setMail(); };
  app.querySelectorAll("[data-ak]").forEach(b=>b.onclick=()=>{ askKind=b.dataset.ak; app.querySelectorAll("[data-ak]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); setMail(); });
  const thanks=(code)=>{ const t=document.getElementById("askThanks"); if(t) t.innerHTML=`<section class="card thanks"><h3>보내 주셔서 고마워요!</h3><p>꼼꼼히 읽고 답변할게요. 보내 주신 한마디 덕분에 표지기가 조금씩 나아져요.</p>${code?`<p class="hint" style="color:var(--ink)">확인 번호 <b style="font-size:18px;letter-spacing:1px">${code}</b> · 답변이 달리면 이 화면의 '내 문의'에서 볼 수 있어요.</p>`:""}</section>`; const c=document.getElementById("askCard"); if(c) c.hidden=true; };
  if(mail) mail.onclick=e=>{ if(!(ta&&ta.value.trim())||!(ag&&ag.checked)){ if(e&&e.preventDefault) e.preventDefault(); if(note) note.textContent=!(ta&&ta.value.trim())?"내용을 적어 주세요.":"동의에 체크해 주세요."; return; } setMail(); thanks(""); };
  const send=document.getElementById("askSend");
  if(send) send.onclick=()=>{
    const text=((ta&&ta.value)||"").trim();
    if(!text){ if(note) note.textContent="내용을 적어 주세요."; return; }
    if(!(ag&&ag.checked)){ if(note) note.textContent="동의에 체크해 주세요."; return; }
    send.disabled=true; if(note) note.textContent="보내는 중...";
    fetch("/api/ask",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({kind:askKind,text:text.slice(0,500),agree:true})})
      .then(r=>r.json().catch(()=>({})).then(d=>({ok:r.ok,d})))
      .then(({ok,d})=>{ if(ok&&d.code){ saveAsk({code:d.code,at:ymd(new Date()),kind:askKind,text:text.slice(0,60)}); thanks(d.code); if(note) note.textContent=""; }
        else { send.disabled=false; if(note) note.textContent=d.error==="limit"?"오늘은 더 보낼 수 없어요. 내일 다시 보내 주세요.":"보내지 못했어요. 잠시 뒤 다시 눌러 주세요."; } })
      .catch(()=>{ send.disabled=false; if(note) note.textContent="인터넷 연결을 확인하고 다시 눌러 주세요."; });
  };
  const box=document.getElementById("myAsks");
  if(box && typeof fetch==="function") Promise.all(mine.slice(0,10).map(m=>fetch("/api/ask?code="+encodeURIComponent(m.code)).then(r=>r.ok?r.json():null).catch(()=>null).then(d=>({m,d}))))
    .then(rows=>{ box.innerHTML=rows.map(({m,d})=>{ const st2=d&&d.status, rep=d&&d.reply;
      return `<div class="sup"><div class="sup-h"><b>${m.kind} · ${m.at}</b><span class="chip ${rep?"k":""}">${!d?"확인 불가":rep?"답변 완료":st2==="closed"?"처리 완료":"답변 대기"}</span></div><p class="hint">${String((d&&d.text)||m.text).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}</p>${rep?`<p class="reply"><b>운영자 답변</b> ${String(rep).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}</p>`:""}<p class="src">확인 번호 ${m.code}</p></div>`; }).join(""); });
}

function allProgs(){
  const today=new Date();
  const dated=CAL.filter(ev=>/신청|접수|모집/.test(ev.n) && evState(ev,today)!=="끝남");
  const corpRows=[...dated.filter(isCorp).map(ev=>({n:ev.n,chip:evState(ev,today)+" · "+md(ev.s)+(ev.s!==ev.e?"~"+md(ev.e):""),t:(ev.who||"")+(ev.act?" · "+ev.act:""),links:[["공식 페이지",ev.url]]})),
    ...WAITING.filter(isCorp).map(w=>({n:w.n,chip:"다음 모집 대기",t:w.hint,links:[["공식 페이지",w.url]]}))];
  const group=cat=>[...dated.filter(ev=>ev.cat===cat).map(ev=>({n:ev.n,chip:evState(ev,today)+" · "+md(ev.s)+"~"+md(ev.e),t:ev.who,links:[["홈페이지",ev.url]]})),
    ...ALWAYS.filter(a=>a.cat===cat).map(a=>({n:a.n,chip:"상시",t:a.t,links:a.links}))];
  const row=x=>`<div class="ev"><div class="sup-h"><b>${x.n}</b><span class="chip">${x.chip}</span></div><p class="hint">${x.t||""}</p><div class="links">${x.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join("")}</div></div>`;
  el(`<section style="display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">지원제도 모아보기</span><h1>지금 신청할 수 있는 모든 지원</h1><p class="lede">내 상황에 맞춘 추천은 진로 찾기를 끝내면 결과 화면에서 볼 수 있어요. 여기서는 전체 목록을 봅니다.</p></div>
    <section class="card money"><h3>돈 지원</h3>${group("money").map(row).join("")}</section>
    <section class="card"><h3>취업·훈련·상담 지원</h3>${group("help").map(row).join("")}</section>
    <section class="card"><h3>기업 교육·채용 연계 프로그램</h3>${corpRows.map(row).join("")}</section>
    <div class="cta"><button class="btn" id="toCal" type="button">정부·기업 캘린더 보기</button></div>
  </section>`);
  document.getElementById("toCal").onclick=()=>{st.phase="cal"; render();};
}

const DICT_CATS=[["all","전체",null],["tech","기술·현장",["sec","avs","fac","tec","aut","bld","arc","rail","avi","log","env"]],["office","사무·IT·금융",["off","fin","tax","lgl","trd","it","eng","sal","bop","pln","rea"]],["arts","문화·디자인·언론",["med","dsn","art","mkt"]],["public","공공·교사",["pub","pbc","uni","mlc","tch"]],["care","보건·돌봄·체육",["doc","nur","mtc","hcl","diet","car","cns","kid","spo","ath","edu"]],["svc","서비스·창업",["ckg","bty","svc","own"]],["stu","학생",["adv","hsj"]]];
function dict(){
  const n=Object.values(JOBS).reduce((a,b)=>a+b.length,0);
  el(`<section style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">직업백과사전</span><h1>직업 ${PATHS.length}개 분야, 세부 ${n}개</h1><p class="lede">이름을 누르면 자격·공고·영상이 펼쳐져요.</p></div>
    <input class="dsearch" id="dq" type="search" placeholder="찾기: 경비, 간호, 요리, 공무원" value="${dictQ.replace(/"/g,"&quot;")}" aria-label="직업 검색">
    <div class="seg" role="group" aria-label="분야">${DICT_CATS.map(c=>`<button type="button" data-dc="${c[0]}" aria-pressed="${dictCat===c[0]}">${c[1]}</button>`).join("")}</div>
    <div id="dlist" class="dlist"></div>
    <p class="src">더 많은 직업은 <a href="https://www.career.go.kr" target="_blank" rel="noopener">커리어넷 직업백과</a>, <a href="https://www.work24.go.kr" target="_blank" rel="noopener">고용24 직업정보</a>에서 볼 수 있어요. 연봉은 대략적인 범위예요.</p>
  </section>`);
  const short=p=>(p.sal?`연 ${p.sal[0].toLocaleString()}~${p.sal[1].toLocaleString()}만원`:p.salNote?"연봉 편차 큼":"진학")+` · 준비 ${prepTxt(p.prep)}`+(AIX[p.key]?` · AI 영향 ${AIXT[AIX[p.key]][0]}`:"");
  const draw=()=>{
    const q=dictQ.trim(), cat=DICT_CATS.find(c=>c[0]===dictCat), keys=cat&&cat[2];
    const hit=p=>(q || !keys || keys.includes(p.key)) && (!q || [p.n,p.need,...(JOBS[p.key]||[]),...((GUIDE[p.key]||{cert:[]}).cert.map(c=>c[0]))].join(" ").includes(q));
    const L=PATHS.filter(hit);
    const box=document.getElementById("dlist"); if(!box) return;
    box.innerHTML = L.length ? L.map(p=>{ const G=GUIDE[p.key]||{cert:[],links:[]}, j=jobLink(p.key);
      return `<details class="drow"><summary><span class="dn">${p.n}</span><span class="ds">${short(p)}</span></summary>
      <div class="dbody">
        <p class="hint">직업을 누르면 자세히 보여요</p>
        <div class="jobs">${(JOBS[p.key]||[]).map(x=>`<button type="button" class="chip jchip" data-job="${x}" data-pk="${p.key}" aria-expanded="false">${x}</button>`).join("")}</div>
        <div class="jdet" id="jd-${p.key}" hidden></div>
        <p class="hint" style="color:var(--ink)">${p.need}</p>
        ${G.cert.length?`<ul class="glist">${G.cert.map(c=>`<li><b>${c[0]}</b> · ${c[1]}${c[2]?` <a href="${c[2]}" target="_blank" rel="noopener">바로가기 ↗</a>`:""}</li>`).join("")}</ul>`:""}
        <div class="links"><a href="${j[1]}" target="_blank" rel="noopener">${j[0].replace(/ \(.*\)$/,"")} ↗</a><a href="${yt(p.key)}" target="_blank" rel="noopener">현직자 영상 ↗</a>${PRO[p.key]?`<a href="${PRO[p.key].url}" target="_blank" rel="noopener">장점·연봉 출처 ↗</a>`:""}</div>
      </div></details>`; }).join("")
      : `<p class="hint">'${q.replace(/</g,"&lt;")}'에 맞는 직업이 아직 없어요. 커리어넷 직업백과에서 찾아보세요.</p>`;
  };
  const bindJobs=()=>{ app.querySelectorAll("[data-job]").forEach(b=>b.onclick=()=>{
    const name=b.dataset.job, pk=b.dataset.pk, p=PATHS.find(x=>x.key===pk), box=document.getElementById("jd-"+pk); if(!box||!p) return;
    const open=b.getAttribute("aria-expanded")==="true";
    app.querySelectorAll(`[data-pk="${pk}"]`).forEach(x=>x.setAttribute("aria-expanded","false"));
    if(open){ box.hidden=true; return; }
    b.setAttribute("aria-expanded","true");
    const d=JOBD[name]||["",""]; const q=name.replace(/\s*\(.*\)/,"");
    box.innerHTML=`<h4>${name}</h4>${d[0]?`<p><b>하는 일</b> · ${d[0]}</p>`:""}${d[1]?`<p><b>되는 법</b> · ${d[1]}</p>`:""}
      <p class="hint">분야 기준 · ${p.sal?`연 ${p.sal[0].toLocaleString()}~${p.sal[1].toLocaleString()}만원 (대략)`:(p.salNote||"진학 경로")} · 준비 ${prepTxt(p.prep)}</p>
      <div class="links"><a href="https://www.saramin.co.kr/zf_user/search?searchword=${encodeURIComponent(q)}" target="_blank" rel="noopener">${q} 채용공고 ↗</a><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(q+" 현실")}" target="_blank" rel="noopener">현직자 영상 ↗</a><a href="https://search.naver.com/search.naver?query=${encodeURIComponent(q+" 직업정보")}" target="_blank" rel="noopener">직업정보 검색 ↗</a></div>`;
    box.hidden=false;
  }); };
  const draw0=draw; const drawAll=()=>{ draw0(); bindJobs(); };
  drawAll();
  const inp=document.getElementById("dq"); if(inp) inp.oninput=()=>{ dictQ=inp.value; drawAll(); };
  app.querySelectorAll("[data-dc]").forEach(b=>b.onclick=()=>{ dictCat=b.dataset.dc; app.querySelectorAll("[data-dc]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); drawAll(); });
}
function privacy(){
  el(`<section style="display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">개인정보 안내</span><h1>내 답은 어디로 가나요?</h1></div>
    <section class="card">
      <h3>답은 내 기기에만 저장돼요</h3>
      <p class="hint" style="color:var(--ink)">질문에 고른 답과 적은 문장은 지금 쓰는 기기의 브라우저에만 저장돼요. 중간에 나갔다가 이어서 하기 위한 용도이고, 운영자는 볼 수 없어요.</p>
      <h3>익명 이용 통계</h3>
      <p class="hint" style="color:var(--ink)">서비스를 고치기 위해 방문·시작·완주 시각(분 단위), 상황 종류(예: 고등학생), 나이대, 추천된 길 3개, 만족도 버튼, '이 추천은 아니에요' 선택, 결과 전에 그만둔 질문 번호만 기록해요. 누가 했는지 알 수 없게 남기고, 답 내용, 적은 문장, 이름, 연락처, IP 주소는 저장하지 않아요.</p>
      <h3>한마디 피드백</h3>
      <p class="hint" style="color:var(--ink)">결과 화면에서 '피드백 보내기'를 누를 때만 그 한마디(300자 이내)와 만족도, 상황 종류, 추천 결과가 서버에 저장돼 운영자가 읽어요. 90일 뒤 자동으로 지워지니 이름·연락처는 적지 마세요. 같은 사람이 하루 5번까지 보낼 수 있고, 이를 세려고 IP 주소를 알아볼 수 없게 바꾼 값만 이틀 보관해요.</p>
      <h3>지우는 방법</h3>
      <p class="hint" style="color:var(--ink)">메뉴의 '처음부터 다시'를 누르면 저장된 답이 모두 지워져요. 브라우저의 사이트 데이터를 삭제해도 지워집니다.</p>
      <h3>AI 기능을 쓸 때만</h3>
      <p class="hint" style="color:var(--ink)">결과 화면에서 '내 이야기 읽어 주기'를 누르면, 그때 답 내용이 Anthropic의 AI(Claude)로 보내져 답변을 만들어요. 표지기 서버는 답변 내용을 저장하지 않아요. 하루 이용 횟수를 세기 위해 IP 주소를 알아볼 수 없게 바꾼 값만 이틀 동안 보관한 뒤 자동으로 지워요. 누르지 않으면 아무것도 보내지 않아요.</p>
      <h3>바깥 링크</h3>
      <p class="hint" style="color:var(--ink)">고용24, 복지로, 한국장학재단 같은 링크를 누르면 해당 기관 사이트로 이동하고, 그곳의 개인정보 처리방침이 적용돼요.</p>
      <h3>문의</h3>
      <p class="hint" style="color:var(--ink)">개인정보나 서비스에 대한 문의는 운영자 이메일 <a class="mailto" href="#">이메일</a>로 보내 주세요.</p>
    </section>
  </section>`);
}
// 메뉴
(function(){
  const btn=document.getElementById("menuBtn"), panel=document.getElementById("menuPanel");
  if(!btn||!panel) return;
  const close=()=>{panel.hidden=true; btn.setAttribute&&btn.setAttribute("aria-expanded","false");};
  btn.onclick=(e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); const open=panel.hidden; panel.hidden=!open; btn.setAttribute&&btn.setAttribute("aria-expanded",String(open));
    const r=document.getElementById("navResult"); if(r) r.hidden=!st.done; };
  if(document.addEventListener) document.addEventListener("click",(e)=>{ if(!panel.hidden && panel.contains && !panel.contains(e.target) && e.target!==btn) close(); });
  (panel.querySelectorAll?panel.querySelectorAll("button[data-nav]"):[]).forEach(b=>b.onclick=()=>{
    const to=b.dataset.nav; close();
    if(to==="reset"){ reset(); return; }
    if(to==="result"){ if(st.done){ st.phase="result"; render(); } return; }
    if(to==="cal"){ calMonth=null; calSel=null; calF="all"; }
    st.phase=to; render();
  });
})();

function reset(){ st={ans:{},i:0,phase:"intro",mid:-1,review:0,fb:null,fbt:"",miss:{},fbSent:0,run:null}; save(); render(); }
document.getElementById("resetBtn").onclick=reset;

// 문의 이메일 (스팸 수집기를 피하려고 화면에서 조립)
const MAIL=["songminhyeok1005","naver.com"].join("@");
function fillMail(){ const a=document.getElementById("mail"); if(a){ a.href="mailto:"+MAIL; a.textContent=MAIL; }
  if(app.querySelectorAll) app.querySelectorAll("a.mailto").forEach(x=>{ x.href="mailto:"+MAIL; x.textContent=MAIL; }); }
try{ if(window.addEventListener) window.addEventListener("pagehide",()=>{ if(st.phase==="q" && !st.done){ const q=list()[st.i]; if(q) track({type:"leave",at:q.id}); } else track({type:"leave",at:st.phase}); }); }catch(e){}
function render(){
  if(st.phase==="q" && st.i>=list().length){ st.phase="result"; }
  drawTrail();
  ({intro,q:question,mid,result,cal:calendar,all:allProgs,privacy,dict,ask})[st.phase]();
  // 화면마다 다른 제목과 현재 위치(탐색경로)
  const TT={intro:"표지기 · 10대·20대 초 무료 진로 검사",mid:"중간 점검 · 표지기",result:"내 길 3개 · 표지기",cal:"정부·기업 캘린더 · 표지기",all:"지원제도 모아보기 · 표지기",privacy:"개인정보 안내 · 표지기",dict:"직업백과사전 · 표지기",ask:"문의하기 · 표지기"};
  try{ document.title = st.phase==="q" ? `질문 ${st.i+1} / ${list().length} · 표지기` : (TT[st.phase]||"표지기"); }catch(e){}
  const CN={result:"내 결과",cal:"정부·기업 캘린더",all:"지원제도 모아보기",privacy:"개인정보 안내",dict:"직업백과사전",ask:"문의하기"};
  if(CN[st.phase] && app.insertAdjacentHTML){ app.insertAdjacentHTML("afterbegin",`<nav class="crumb" aria-label="현재 위치"><a href="#" data-crumb="1">표지기</a><span aria-hidden="true"> › </span><span aria-current="page">${CN[st.phase]}</span></nav>`); const cb=app.querySelector("[data-crumb]"); if(cb) cb.onclick=e=>{ if(e&&e.preventDefault) e.preventDefault(); st.phase="intro"; render(); }; }
  fillMail();
}
try{ if(location.hash==="#ask") st.phase="ask"; }catch(e){}
// 들어온 곳: 이전 사이트 주소의 도메인과 검색어만 (전체 주소는 보내지 않음)
try{ const v={type:"visit",src:(new URLSearchParams(location.search).get("src")||"").slice(0,20)};
  try{ if(document.referrer){ const u=new URL(document.referrer); if(u.hostname!==location.hostname){ v.ref=u.hostname.toLowerCase().slice(0,60); const kw=["query","q","wd","search_query","keyword","p","oquery"].map(k=>u.searchParams.get(k)).find(Boolean); if(kw) v.kw=kw.slice(0,40); } } }catch(e){}
  track(v); }catch(e){ track({type:"visit"}); }
render();
